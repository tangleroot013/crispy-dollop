version: '3.8'

services:
  crispy-dollop-vpn:
    build: .
    container_name: crispy-dollop-vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    volumes:
      - /lib/modules:/lib/modules:ro
      - wireguard-config:/etc/wireguard
    environment:
      - MULLVAD_COUNTRY=nl
      - MULLVAD_CITY=ams
      - WG_MTU=1280
    restart: unless-stopped

volumes:
  wireguard-config: